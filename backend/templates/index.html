<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Product Images</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
    }
    .container {
      max-width: 700px;
      margin-top: 50px;
      padding: 30px;
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    .file-input {
      border: 2px dashed #0d6efd;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      border-radius: 10px;
      transition: background-color 0.2s;
    }
    .file-input:hover {
      background-color: #e9f0ff;
    }
    #preview img {
      max-width: 100px;
      margin: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <h2 class="mb-4">Upload Product Images</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-success">
          {% for message in messages %}
            {{ message }}<br>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3 text-start">
        <label for="category" class="form-label">Select Category:</label>
        <select class="form-select" name="category" id="category" required>
          <option value="">-- Choose Category --</option>
          <option value="metal">Metal</option>
          <option value="ceramic">Ceramic</option>
          <option value="textile">Textile</option>
        </select>
      </div>

      <div class="mb-3 file-input" onclick="document.getElementById('files').click();">
        <p>Click or drag & drop to upload images (single/multiple)</p>
        <input type="file" id="files" name="files" accept="image/*" multiple style="display:none;" onchange="previewFiles()">
      </div>

      <div id="preview" class="d-flex flex-wrap justify-content-center"></div>

      <button type="submit" class="btn btn-primary mt-3 w-50">Upload</button>
    </form>
  </div>

  <script>
    function previewFiles() {
      const preview = document.getElementById('preview');
      preview.innerHTML = '';
      const files = document.getElementById('files').files;
      for(let i=0; i<files.length; i++) {
        const reader = new FileReader();
        reader.onload = function(e){
          const img = document.createElement('img');
          img.src = e.target.result;
          preview.appendChild(img);
        }
        reader.readAsDataURL(files[i]);
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
